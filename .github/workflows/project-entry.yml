name: Project entry and recovery identities
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch immutable recovery inputs
        run: git fetch --no-tags origin '+refs/heads/codex/preserve-*:refs/remotes/origin/codex/preserve-*'
      # Candidate PRs must differ from the currently published entry. Fresh-entry
      # checks are for consumers after publication, not for the publishing PR.
      - name: Verify entry, design sources and all captured content
        run: python3 tools/scripts/project_control.py check --full
      - name: Verify authority, decision conflicts and review deadlines
        run: python3 tools/scripts/design_governance.py status
      - name: Verify stale-entry, expiry and live-drift rejection
        run: python3 -m unittest discover -s tools/tests -p 'test_design_governance.py' -v
      - name: Verify current engineering input identities
        run: python3 tools/scripts/engineering.py check
      - name: Verify delivery baseline identities and retained production holds
        run: python3 tools/scripts/delivery_baseline.py
      - name: Verify engineering corruption and isolated export rejection
        run: python3 -m unittest discover -s tools/tests -p 'test_engineering.py' -v
      - name: Verify explicit music profiles and independent amplitude guards
        run: python3 -m unittest discover -s tools/tests -p 'test_music_profiles.py' -v
      - name: Verify shared resource reference and mutation guards
        run: python3 -m unittest discover -s experiments/note_resource_20261024/tests -v
      - name: Verify audio-backend mutation routing and failure guards
        run: python3 -m unittest discover -s experiments/note_resource_20261024/audio/tests -v
      - name: Verify real partial renderer arithmetic and mutation guards
        run: python3 -m unittest discover -s experiments/note_resource_20261024/audio/renderer/tests -v
      - name: Verify tagged input router and incomplete STA rejection
        run: python3 -m unittest discover -s experiments/note_resource_20261024/input/tests -v
  verify-pcb-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      # Bulk blobs live in release pcb-951-full-20261025; this job proves the
      # in-tree bytes against Git and the external ones against their pinned
      # sha256. The scheduled job below re-proves the external bytes in full.
      - name: Verify in-tree checkpoint bytes and pinned external identities
        run: python3 tools/scripts/pcb_checkpoint.py --git-ref HEAD
  verify-release-blobs:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Download release-hosted checkpoint blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root=hardware/checkpoints/pcb-951ce88a-20261025
          gh release download pcb-951-full-20261025 --dir "$root/recovery" --pattern 'archive.part*'
          gh release download pcb-951-full-20261025 --dir "$root/offline" \
            --pattern 'MUX_DISABLE-IOtail-cleanup-audited-plane-context.json' \
            --pattern 'MUX_DISABLE-IOtail-guide-verified-input-cache.json'
      - name: Verify every sealed byte including release-hosted blobs
        run: python3 tools/scripts/pcb_checkpoint.py --git-ref HEAD --require-external
  maintain-legacy-entry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Keep old entry consumers following verified repository main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'sakuyaShining/FPGA-Music-project-internal'
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .id)" = 1404161021
          git fetch origin main codex/project-management-20261022
          git merge-base --is-ancestor origin/codex/project-management-20261022 origin/main
          git push origin refs/remotes/origin/main:refs/heads/codex/project-management-20261022
